<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>CSS Animation Example</title>

  <style>
    body {
      text-align: center;
      margin-top: 100px;
      font-family: Arial, sans-serif;
    }

    button {
      font-size: 20px;
      padding: 10px 20px;
      cursor: pointer;
    }

    .heart {
      font-size: 60px;
      margin-top: 20px;
      opacity: 0;
    }

    @keyframes pop {
      0% {
        transform: scale(0.5);
        opacity: 0;
      }
      50% {
        transform: scale(1.3);
        opacity: 1;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .animate {
      animation: pop 0.6s ease forwards;
    }
  </style>
</head>

<body>
  <button onclick="showHeart()">눌러봐 💖</button>
  <div id="heart" class="heart">💖</div>

  <script>
    function showHeart() {
      const heart = document.getElementById("heart");
      heart.classList.remove("animate");
      void heart.offsetWidth; // 애니메이션 리셋
      heart.classList.add("animate");
    }
  </script>
</body>
</html>
