<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>이력서</title>
  <style>
    body {
      font-family: Arial, sans-serif;
    }

    table {
      width: 800px;
      border-collapse: collapse;
      margin: 20px auto;
    }

    th, td {
      border: 1px solid #000;
      padding: 8px;
      font-size: 14px;
    }

    tr {
      height: 45px; /* 모든 줄 높이 통일 */
    }

    th {
      background: #f2f2f2;
      text-align: center;
      font-weight: bold;
    }

    .title {
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      padding: 15px;
    }

    .label {
      width: 120px;
      background: #f9f9f9;
      text-align: center;
      font-weight: bold;
    }

    .center {
      text-align: center;
    }
  </style>
</head>
<body>

<table>
  <tr>
    <td colspan="6" class="title">이 력 서</td>
  </tr>

  <tr>
    <td class="label">성명</td>
    <td colspan="2"></td>
    <td class="label">주민등록번호</td>
    <td colspan="2"></td>
  </tr>

  <tr>
    <td class="label">생년월일</td>
    <td colspan="2"></td>
    <td class="label">만 나이</td>
    <td colspan="2"></td>
  </tr>

  <tr>
    <td class="label">주소</td>
    <td colspan="5"></td>
  </tr>

  <tr>
    <td class="label">E-mail</td>
    <td colspan="2"></td>
    <td class="label">연락처</td>
    <td colspan="2"></td>
  </tr>

  <tr>
    <th class="center">년</th>
    <th class="center">월</th>
    <th colspan="3" class="center">학력 및 경력사항</th>
    <th class="center">비고</th>
  </tr>

  <!-- 학력/경력 8줄 -->
  <tr><td></td><td></td><td colspan="3"></td><td></td></tr>
  <tr><td></td><td></td><td colspan="3"></td><td></td></tr>
  <tr><td></td><td></td><td colspan="3"></td><td></td></tr>
  <tr><td></td><td></td><td colspan="3"></td><td></td></tr>
  <tr><td></td><td></td><td colspan="3"></td><td></td></tr>
  <tr><td></td><td></td><td colspan="3"></td><td></td></tr>
  <tr><td></td><td></td><td colspan="3"></td><td></td></tr>
  <tr><td></td><td></td><td colspan="3"></td><td></td></tr>
</table>

</body>
</html>
